    applyTweaks: function (tw) {
      if (tw.palette && PALETTES[tw.palette]) { pal = PALETTES[tw.palette]; palName = tw.palette; }
      if (tw.mood && MOODS[tw.mood]) mood = MOODS[tw.mood];
      if (typeof tw.density === 'number') density = clamp(tw.density, 0.3, 1.6);
      if (typeof tw.speed === 'number') speed = clamp(tw.speed, 0.3, 3);
    },
    regen: function (newSeed) {
      seed = (typeof newSeed === 'number') ? newSeed : (Math.random() * 1e9) | 0;
      tree = buildTree(seed);
      matScaleMax = fitScaleFor(tree.bounds);
      fallingLeaves = [];
      fallingBranches = [];
      waterDrops = []; waterSplashes = []; waterEmit = 0;
      healPulse = 0; waterPulse = 0; soilMoist = 0;
      flash = 0; scorch = 0; sparkBolt = null; embers = []; flames = [];
    },
    renderNow: function () { render(performance.now()); },
    destroy: function () {
      stopped = true;
      clearTimeout(fallbackTimer);
      if (fallbackInterval) clearInterval(fallbackInterval);
    },
    onStageChange: null
  };
  return api;
}

// ---- Orion mid-stride, in PROFILE — walk cycle from the design session ----
// Two-bone IK legs (bending knees) + elbows, stance/swing gait with heel-strike
// and toe-off. NO-SLIP CONTRACT: the caller advances `phase` by distance
// travelled × WALK_K so planted feet stay planted (see WALK_K below).
function drawAtlasWalker(ctx, x, groundY, s, phase) {
  // ---- gait constants (local px, at scale 1) ----------------------
  var TAU = Math.PI * 2;
  var A = 34;                 // foot reach forward at heel strike
  var B = 34;                 // foot reach back at toe-off
  var STANCE = 0.6 * TAU;     // foot planted 60% of the cycle
  var STRIDE = A + B;         // ground sweep of a planted foot

  var L_THIGH = 46, L_CALF = 44, ANKLE_H = 12;   // leg segments
  var L_UARM = 40, L_FARM = 34;                  // arm segments
  var HIP_Y = -92, SHO_Y = -152;                 // above ground line
  var HEAD_R = 30, HEAD_CX = 6, HEAD_CY = -190;  // head held high — hunched reads wrong
  var LEAN = 0.045;                              // ~2.5 deg forward lean

  var C_SKIN = '#b97a4e', C_SKINF = '#a06a45', C_HAIR = '#2f2318';
  var C_TOP = '#68927c', C_TOPF = '#55796a';
  var C_TRO = '#3f3f4a', C_TROF = '#32323c';
  var C_SHO = '#3a2817', C_SHOF = '#2a1c10';

  // vertical bob: highest at the passing pose, lowest at double-support
  var bob = -3.5 * Math.cos(2 * (phase - 0.6 * Math.PI));
  var hy = HIP_Y + bob;
  var shy = SHO_Y + bob;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); }
  function circle(cx, cy, r) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill(); }
  function bone(x1, y1, x2, y2, w, col) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ankle position + shoe angle for one leg at its local phase 'th'
  function footOf(th) {
    th = th % TAU; if (th < 0) th += TAU;
    var fx, fy, ang;
    if (th < STANCE) {                 // ---- STANCE: planted -----------
      var p = th / STANCE;             // 0..1
      fx = A - STRIDE * p;             // linear -> world foot is still
      var heel = 8 * Math.max(0, (p - 0.75) / 0.25);  // heel lifts late
      fy = -ANKLE_H - heel;
      ang = 0.30 * Math.max(0, 1 - p * 5)             // toe-up heel strike
        - 0.60 * Math.max(0, (p - 0.72) / 0.28);      // toe-down push-off
    } else {                           // ---- SWING: recover forward ----
      var q = (th - STANCE) / (TAU - STANCE);
      fx = -B + STRIDE * smooth(q);
      fy = -ANKLE_H - 18 * Math.sin(Math.PI * q);     // ground-clear arc
      ang = 0.14 * Math.sin(Math.PI * q);
    }
    return { x: fx, y: fy, a: ang };
  }

  // two-bone IK; fwd=true bends the joint toward +x (knee), else -x (elbow)
  function ik(hx, hyy, ax, ay, l1, l2, fwd) {
    var dx = ax - hx, dy = ay - hyy, d = Math.sqrt(dx * dx + dy * dy), mr = l1 + l2 - 0.01;
    if (d > mr) { ax = hx + dx / d * mr; ay = hyy + dy / d * mr; dx = ax - hx; dy = ay - hyy; d = mr; }
    if (d < 0.01) d = 0.01;
    var a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
    var base = Math.atan2(dy, dx);
    var x1 = hx + Math.cos(base + a) * l1, x2 = hx + Math.cos(base - a) * l1;
    var ang = fwd ? (x1 > x2 ? base + a : base - a) : (x1 < x2 ? base + a : base - a);
    return { kx: hx + Math.cos(ang) * l1, ky: hyy + Math.sin(ang) * l1, ax: ax, ay: ay };
  }

  function drawShoe(col) { ctx.fillStyle = col; rr(-11, 3, 35, 11, 5); ctx.fill(); }

  function drawLeg(hipx, foot, cT, cS) {
    var L = ik(hipx, hy, foot.x, foot.y, L_THIGH, L_CALF, true);
    bone(hipx, hy, L.kx, L.ky, 22, cT);      // thigh
    bone(L.kx, L.ky, L.ax, L.ay, 17, cT);    // calf
    ctx.save(); ctx.translate(L.ax, L.ay); ctx.rotate(foot.a); drawShoe(cS); ctx.restore();
  }

  function drawArm(th, cU, darker) {
    var sx = 0, sy = shy;
    var sw = -0.5 * Math.cos(th);            // + forward, opposite same-side leg
    var ang = Math.PI / 2 - sw;              // PI/2 = straight down
    var reach = L_UARM + L_FARM - 8;         // slack -> relaxed elbow bend
    var wx = sx + Math.cos(ang) * reach, wy = sy + Math.sin(ang) * reach;
    var E = ik(sx, sy, wx, wy, L_UARM, L_FARM, false);
    bone(sx, sy, E.kx, E.ky, 15, cU);        // upper arm
    bone(E.kx, E.ky, E.ax, E.ay, 12, cU);    // forearm
    ctx.fillStyle = cU; circle(sx, sy + 1, 10.5);   // deltoid — sockets the arm into the shoulder
    ctx.fillStyle = darker ? C_SKINF : C_SKIN; circle(E.ax, E.ay, 6);  // hand
  }

  function leanBegin() { ctx.save(); ctx.translate(0, hy); ctx.rotate(LEAN); ctx.translate(0, -hy); }
  function leanEnd() { ctx.restore(); }

  function drawTorso() { bone(0, hy - 2, 0, shy, 46, C_TOP); }

  function drawHead() {
    var cx = HEAD_CX, cy = HEAD_CY + bob;
    bone(2, shy + 3, cx - 1, cy + HEAD_R - 11, 12, C_SKIN);   // slim neck, tucked behind the chin
    ctx.fillStyle = C_SKIN; circle(cx, cy, HEAD_R);               // skull
    ctx.fillStyle = C_HAIR;                                       // crown + back cap,
    ctx.beginPath();                                              // hairline over the ear
    ctx.arc(cx, cy, HEAD_R * 1.03, -1.05, 2.55, true);
    ctx.quadraticCurveTo(cx - HEAD_R * 0.50, cy + HEAD_R * 0.10, cx - HEAD_R * 0.05, cy - HEAD_R * 0.02);
    ctx.quadraticCurveTo(cx + HEAD_R * 0.30, cy - HEAD_R * 0.30, cx + HEAD_R * 0.53, cy - HEAD_R * 0.92);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = C_SKINF; circle(cx - 4, cy + 7, 5);           // ear at the skull centre
    ctx.strokeStyle = '#8d5c38'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx - 4, cy + 7, 2.4, -0.6 * Math.PI, 0.5 * Math.PI); ctx.stroke();
    // nose
    ctx.fillStyle = C_SKIN;
    ctx.beginPath(); ctx.moveTo(cx + HEAD_R + 1, cy - 1);
    ctx.quadraticCurveTo(cx + HEAD_R + 11, cy + 4, cx + HEAD_R + 1, cy + 9); ctx.closePath(); ctx.fill();
    // eye
    ctx.fillStyle = '#2b2018'; circle(cx + 14, cy - 3, 2.6);
    // brow: neutral/friendly, front end slightly higher (never angled down = scowl)
    ctx.strokeStyle = '#2b2018'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx + 8, cy - 11); ctx.lineTo(cx + 20, cy - 12); ctx.stroke();
    // gentle content mouth
    ctx.strokeStyle = '#7a4a2e'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(cx + 12, cy + 13); ctx.quadraticCurveTo(cx + 18, cy + 16, cx + 23, cy + 11); ctx.stroke();
  }

  // ---- compose -----------------------------------------------------
  ctx.save();
  ctx.translate(x, groundY);
  ctx.scale(s, s);
  ctx.lineJoin = 'round';

  ctx.fillStyle = 'rgba(30,25,20,0.12)';               // contact shadow
  ctx.beginPath(); ctx.ellipse(0, 0, 44, 7, 0, 0, TAU); ctx.fill();

  drawLeg(-3, footOf(phase + Math.PI), C_TROF, C_SHOF);           // far leg
  leanBegin(); drawArm(phase + Math.PI, C_TOPF, true); leanEnd(); // far arm
  leanBegin(); drawTorso(); drawHead(); leanEnd();                // body + head
  drawLeg(3, footOf(phase), C_TRO, C_SHO);                        // near leg
  leanBegin(); drawArm(phase, C_TOP, false); leanEnd();           // near arm

  ctx.restore();
}

// ============================================================================
// Orion pose & expression library — the character reference sheet, fully
// procedural (no image assets). Used by the game (wave on arrival) and by
// scripts/atlas-poses.html to render the sheet for review.
//   drawAtlasPose(ctx, x, groundY, s, spec)
//     spec.pose: front | threeq | profile | backthreeq | back | bust |
//                run | wave | point | think | sit        (walk = drawAtlasWalker)
//     spec.expr: neutral | talk | surprised | sad | angry | wink | joy | think
//     spec.t:    time in ms for animated poses (wave wag, run gait)
// ============================================================================
function drawAtlasPose(ctx, x, gy, s, spec) {
  spec = spec || {};
  var pose = spec.pose || 'front', expr = spec.expr || 'neutral', t = spec.t || 0;
  var TAU = Math.PI * 2;
  var SKIN = '#b97a4e', SKIND = '#9c6238', SKINF = '#a06a45';
  var HAIR = '#2f2318', INK = '#2f2318';
  var TOP = '#68927c', TOPD = '#55796a';
  var TRO = '#3f3f4a', TROD = '#32323c';
  var SHOE = '#3a2817', SHOED = '#2a1c10';
  var R = 30, HIP = -92, SHO = -150, HEADC = -196;

  function circle(cx, cy, r) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill(); }
  function bone(x1, y1, x2, y2, w, col) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function rr(rx, ry, rw, rh, rad) {
    ctx.beginPath(); ctx.moveTo(rx + rad, ry);
    ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, rad); ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, rad);
    ctx.arcTo(rx, ry + rh, rx, ry, rad); ctx.arcTo(rx, ry, rx + rw, ry, rad);
    ctx.closePath(); ctx.fill();
  }
  function shadow(w) {
    ctx.fillStyle = 'rgba(30,25,20,0.12)';
    ctx.beginPath(); ctx.ellipse(0, 0, w, 8, 0, 0, TAU); ctx.fill();
  }

  // ---- the face, at head-centre (0,0), radius r; off shifts features (3/4 view) ----
  function face(r, ex, off) {
    off = off || 0;
    var eL = -0.34 * r + off, eR = 0.34 * r + off, eY = -0.08 * r;
    function brow(bx, tilt, lift) {
      ctx.strokeStyle = INK; ctx.lineWidth = 0.11 * r; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx - 0.15 * r, -0.28 * r - lift + tilt);
      ctx.quadraticCurveTo(bx, -0.37 * r - lift, bx + 0.15 * r, -0.28 * r - lift - tilt);
      ctx.stroke();
    }
    function dot(bx, by, rr2) { ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(bx, by, rr2 * 0.9, rr2, 0, 0, TAU); ctx.fill(); }
    function closedHappy(bx) {  // ∩ closed smiling eye
      ctx.strokeStyle = INK; ctx.lineWidth = 0.10 * r; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bx - 0.14 * r, eY + 0.04 * r);
      ctx.quadraticCurveTo(bx, eY - 0.14 * r, bx + 0.14 * r, eY + 0.04 * r); ctx.stroke();
    }
    function mouthLine(dip, wid, thick) {  // dip>0 = smile
      ctx.strokeStyle = INK; ctx.lineWidth = thick || 0.09 * r; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(off * 0.8 - wid, 0.44 * r);
      ctx.quadraticCurveTo(off * 0.8, 0.44 * r + dip, off * 0.8 + wid, 0.44 * r);
      ctx.stroke();
    }
    function mouthOpen(wid) {  // open smile with teeth
      var mx = off * 0.8, my = 0.40 * r;
      ctx.fillStyle = '#5a2a1e';
      ctx.beginPath(); ctx.arc(mx, my, wid, 0, Math.PI); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f5efe2';
      ctx.beginPath(); ctx.rect(mx - wid * 0.78, my, wid * 1.56, wid * 0.34); ctx.fill();
    }
    if (ex === 'neutral') { brow(eL, 0, 0); brow(eR, 0, 0); dot(eL, eY, 0.10 * r); dot(eR, eY, 0.10 * r); mouthLine(0.10 * r, 0.20 * r); }
    else if (ex === 'talk') { brow(eL, 0, 0.05 * r); brow(eR, 0, 0.05 * r); dot(eL, eY, 0.10 * r); dot(eR, eY, 0.10 * r); mouthOpen(0.24 * r); }
    else if (ex === 'surprised') { brow(eL, 0, 0.12 * r); brow(eR, 0, 0.12 * r); dot(eL, eY, 0.13 * r); dot(eR, eY, 0.13 * r);
      ctx.fillStyle = '#5a2a1e'; ctx.beginPath(); ctx.ellipse(off * 0.8, 0.44 * r, 0.10 * r, 0.13 * r, 0, 0, TAU); ctx.fill(); }
    else if (ex === 'sad') { brow(eL, -0.06 * r, 0.02 * r); brow(eR, 0.06 * r, 0.02 * r); dot(eL, eY + 0.02 * r, 0.10 * r); dot(eR, eY + 0.02 * r, 0.10 * r); mouthLine(-0.12 * r, 0.18 * r); }
    else if (ex === 'angry') { brow(eL, 0.10 * r, -0.02 * r); brow(eR, -0.10 * r, -0.02 * r); dot(eL, eY, 0.10 * r); dot(eR, eY, 0.10 * r); mouthLine(-0.06 * r, 0.16 * r, 0.11 * r); }
    else if (ex === 'wink') { brow(eL, 0, 0.02 * r); brow(eR, 0, 0.08 * r); dot(eL, eY, 0.10 * r);
      ctx.strokeStyle = INK; ctx.lineWidth = 0.10 * r; ctx.beginPath();
      ctx.moveTo(eR - 0.13 * r, eY); ctx.quadraticCurveTo(eR, eY + 0.10 * r, eR + 0.13 * r, eY); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 0.09 * r; ctx.beginPath();
      ctx.moveTo(off * 0.8 - 0.16 * r, 0.45 * r); ctx.quadraticCurveTo(off * 0.8 + 0.06 * r, 0.52 * r, off * 0.8 + 0.20 * r, 0.40 * r); ctx.stroke(); }
    else if (ex === 'joy') { brow(eL, 0, 0.10 * r); brow(eR, 0, 0.10 * r); closedHappy(eL); closedHappy(eR); mouthOpen(0.27 * r); }
    else if (ex === 'think') { brow(eL, 0.07 * r, 0); brow(eR, -0.04 * r, 0.03 * r); dot(eL, eY, 0.10 * r); dot(eR, eY, 0.10 * r); mouthLine(-0.02 * r, 0.14 * r); }
  }

  function frontHair(r) {
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.03, Math.PI - 0.08, TAU + 0.08);
    ctx.quadraticCurveTo(0, -r * 0.72, -Math.cos(0.08) * r * 1.03, Math.sin(0.08) * r * 1.03);
    ctx.closePath(); ctx.fill();
  }
  function ear(exx, eyy) {
    ctx.fillStyle = SKIN; circle(exx, eyy, 6);
    ctx.strokeStyle = SKIND; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(exx, eyy, 2.6, -0.6 * Math.PI, 0.5 * Math.PI); ctx.stroke();
  }

  // ---- heads (drawn at head-centre) ----
  function headFront(ex) { ear(-R + 2, 4); ear(R - 2, 4); ctx.fillStyle = SKIN; circle(0, 0, R); frontHair(R); face(R, ex, 0); }
  function headThreeQ(ex, dir) {
    dir = dir || -1;                       // -1 = turned to the viewer's left (reference)
    ear((R - 3) * -dir, 4);
    ctx.fillStyle = SKIN; circle(0, 0, R);
    ctx.save(); ctx.translate(4 * -dir, 0); frontHair(R * 1.02); ctx.restore();
    face(R, ex, 0.16 * R * dir);
  }
  function headProfile() {
    ctx.fillStyle = SKIN; circle(0, 0, R);                    // skull
    ctx.fillStyle = SKIN;                                     // nose, proud of the silhouette
    ctx.beginPath(); ctx.moveTo(R - 2, 2);
    ctx.quadraticCurveTo(R + 9, 7, R - 2, 12); ctx.closePath(); ctx.fill();
    // hair: crown + back only — the hairline sweeps from the front fringe, over the
    // ear, down to the nape (matches the reference sheet's side view)
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.arc(0, 0, R * 1.03, -1.05, 2.55, true);
    ctx.quadraticCurveTo(-R * 0.50, R * 0.10, -R * 0.05, -R * 0.02);
    ctx.quadraticCurveTo(R * 0.30, -R * 0.30, R * 0.53, -R * 0.92);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = SKINF; circle(-4, 7, 5);
    ctx.strokeStyle = '#8d5c38'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(-4, 7, 2.4, -0.6 * Math.PI, 0.5 * Math.PI); ctx.stroke();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(R * 0.44, R * 0.04, 3, 3.6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(R * 0.22, -R * 0.20); ctx.lineTo(R * 0.60, -R * 0.24); ctx.stroke();
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(R * 0.44, R * 0.50); ctx.quadraticCurveTo(R * 0.60, R * 0.54, R * 0.74, R * 0.44); ctx.stroke();
  }
  function headBackThreeQ() {
    ctx.fillStyle = SKIN; circle(0, 0, R);
    ctx.fillStyle = HAIR; circle(2, -1, R * 1.02);
    ear(-R - 2, 5);
  }
  function headBack() {
    ctx.fillStyle = SKIN; circle(0, 0, R);
    ctx.fillStyle = HAIR; circle(0, -1, R * 1.01);
    ear(-R - 2, 5); ear(R + 2, 5);
  }

  // ---- the standing body (front-family views); armR/armL override arm endpoints ----
  function standingBody(view, opts) {
    opts = opts || {};
    var sw = 44, hw = 30;
    var shoulderY = SHO - 14, neckY = HEADC + R - 2;
    shadow(52);
    // legs + shoes
    ctx.fillStyle = TRO; rr(-22, HIP, 17, -HIP - 4, 7); rr(5, HIP, 17, -HIP - 4, 7);
    ctx.fillStyle = SHOE; rr(-27, -9, 25, 11, 5); rr(2, -9, 25, 11, 5);
    // torso
    ctx.fillStyle = view === 'back' || view === 'backthreeq' ? TOP : TOP;
    ctx.beginPath();
    ctx.moveTo(-sw, shoulderY + 6);
    ctx.quadraticCurveTo(-sw - 4, (shoulderY + HIP) / 2, -hw, HIP + 8);
    ctx.quadraticCurveTo(0, HIP + 18, hw, HIP + 8);
    ctx.quadraticCurveTo(sw + 4, (shoulderY + HIP) / 2, sw, shoulderY + 6);
    ctx.quadraticCurveTo(0, shoulderY - 10, -sw, shoulderY + 6);
    ctx.closePath(); ctx.fill();
    // arms
    var aL = opts.armL || { ex: -sw - 2, ey: HIP + 4, mid: null };
    var aR = opts.armR || { ex: sw + 2, ey: HIP + 4, mid: null };
    ctx.strokeStyle = TOPD; ctx.lineCap = 'round'; ctx.lineWidth = 15;
    ctx.beginPath(); ctx.moveTo(-sw + 7, shoulderY + 12);
    if (aL.mid) ctx.lineTo(aL.mid[0], aL.mid[1]);
    ctx.lineTo(aL.ex, aL.ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sw - 7, shoulderY + 12);
    if (aR.mid) ctx.lineTo(aR.mid[0], aR.mid[1]);
    ctx.lineTo(aR.ex, aR.ey); ctx.stroke();
    ctx.fillStyle = SKIN;
    circle(aL.ex, aL.ey + (aL.hand === 'up' ? 0 : 4), 7);
    circle(aR.ex, aR.ey + (aR.hand === 'up' ? 0 : 4), 7);
    // neck
    ctx.fillStyle = SKIN; rr(-8, neckY - 6, 16, 20, 5);
  }

  function profileStandBody() {
    shadow(40);
    ctx.fillStyle = TRO; rr(-8, HIP, 16, -HIP - 6, 7);
    ctx.fillStyle = SHOE; rr(-8, -12, 27, 11, 5);
    var shoulderY = SHO - 14;
    ctx.fillStyle = TOP;
    ctx.beginPath();
    ctx.moveTo(-15, shoulderY);
    ctx.quadraticCurveTo(-21, (shoulderY + HIP) / 2, -14, HIP + 9);
    ctx.lineTo(13, HIP + 9);
    ctx.quadraticCurveTo(21, (shoulderY + HIP) / 2 - 8, 16, shoulderY);
    ctx.quadraticCurveTo(0, shoulderY - 9, -15, shoulderY);
    ctx.closePath(); ctx.fill();
    bone(1, shoulderY + 9, 2, HIP + 2, 14, TOPD);       // near arm hanging
    ctx.fillStyle = TOPD; circle(1, shoulderY + 10, 10);  // deltoid
    ctx.fillStyle = SKIN; circle(2, HIP + 6, 6.5);
    ctx.fillStyle = SKIN; rr(-2, HEADC + R - 8, 12, 20, 5);
  }

  // ---- compose ----
  ctx.save();
  ctx.translate(x, gy);
  ctx.scale(s, s);
  ctx.lineJoin = 'round';

  if (pose === 'front') { standingBody('front'); ctx.save(); ctx.translate(0, HEADC); headFront(expr); ctx.restore(); }
  else if (pose === 'threeq') { standingBody('threeq'); ctx.save(); ctx.translate(0, HEADC); headThreeQ(expr, -1); ctx.restore(); }
  else if (pose === 'profile') { profileStandBody(); ctx.save(); ctx.translate(4, HEADC - 6); headProfile(); ctx.restore(); }
  else if (pose === 'backthreeq') { standingBody('backthreeq'); ctx.save(); ctx.translate(0, HEADC); headBackThreeQ(); ctx.restore(); }
  else if (pose === 'back') { standingBody('back'); ctx.save(); ctx.translate(0, HEADC); headBack(); ctx.restore(); }
  else if (pose === 'bust') {
    ctx.fillStyle = TOP;

    bone(30, HIP + 10, 42, HIP + 46, 17, TRO);        // shin down-forward
    ctx.fillStyle = SHOE;

    ctx.fillStyle = TOP;                              // narrow profile torso
    ctx.beginPath();
    ctx.moveTo(-15, SHO - 2);
    ctx.quadraticCurveTo(-21, (SHO + HIP) / 2, -14, HIP + 9);
    ctx.lineTo(13, HIP + 9);

    ctx.closePath(); ctx.fill();
    bone(-2, SHO + 8, -22, SHO + 30, 12, TOPD);       // far arm pumping back
    ctx.fillStyle = SKINF; circle(-26, SHO + 34, 6);

  }
  else if (pose === 'point') {

      armR: { ex: 86, ey: SHO + 2, mid: null, hand: 'up' }

  else if (pose === 'think') {

      armR: { ex: 14, ey: HEADC + R + 4, mid: [34, HIP - 8], hand: 'up' }  // hand to chin
    });
    ctx.save(); ctx.translate(0, HEADC); headFront('think'); ctx.restore();

  else if (pose === 'sit') {

    // crossed shins
    bone(-34, -12, 20, -22, 17, TROD); bone(34, -12, -20, -22, 17, TRO);

    bone(-24, -40, -6, -26, 20, TRO); bone(24, -40, 6, -26, 20, TRO);
    // torso (lowered)
    ctx.fillStyle = TOP;
    ctx.beginPath();
    ctx.moveTo(-40, -34); ctx.quadraticCurveTo(-42, -78, -30, -96);
    ctx.quadraticCurveTo(0, -108, 30, -96); ctx.quadraticCurveTo(42, -78, 40, -34);
    ctx.quadraticCurveTo(0, -22, -40, -34);
    ctx.closePath(); ctx.fill();
    // arms resting to hands in lap
    bone(-32, -88, -12, -34, 14, TOPD); bone(32, -88, 12, -34, 14, TOPD);
    ctx.fillStyle = SKIN; circle(-8, -30, 6.5); circle(8, -30, 6.5);
    ctx.fillStyle = SKIN; rr(-8, -122, 16, 20, 5);
    ctx.save(); ctx.translate(0, -142); headFront(expr === 'neutral' ? 'neutral' : expr); ctx.restore();
  }

}


// ============================================================================
// Sprite loader — decodes the embedded character artwork (lib/atlas-sprites.js)
// and trims each image to its alpha bounding box so feet anchor to the ground.
// Usage:  loadAtlasSprites(ATLAS_SPRITES).then((reg) => engine.setSprites(reg));
// ============================================================================
function loadAtlasSprites(SPRITES) {
  var keys = Object.keys(SPRITES || {});
  return Promise.all(keys.map(function (k) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        var m = SPRITES[k].m;
        if (m && m.bbox) {           // baked measurements from the build step
          resolve([k, { img: img, sx: m.bbox[0], sy: m.bbox[1], sw: m.bbox[2], sh: m.bbox[3],
                        headTop: m.headTop, headH: m.headH, headW: m.headW,
                        headCx: m.headCx, shoulder: m.shoulder }]);
          return;
        }
        try {
          var cv = document.createElement('canvas');
          cv.width = img.width; cv.height = img.height;
          var c2 = cv.getContext('2d');
          c2.drawImage(img, 0, 0);
          var d = c2.getImageData(0, 0, cv.width, cv.height).data;
          var minX = cv.width, minY = cv.height, maxX = -1, maxY = -1;
          for (var y = 0; y < cv.height; y++) {
            for (var x = 0; x < cv.width; x++) {
              if (d[(y * cv.width + x) * 4 + 3] > 16) {
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
              }
            }
          }
          if (maxX < 0) { minX = 0; minY = 0; maxX = cv.width - 1; maxY = cv.height - 1; }
          resolve([k, { img: img, sx: minX, sy: minY, sw: maxX - minX + 1, sh: maxY - minY + 1 }]);
        } catch (e) { resolve([k, { img: img, sx: 0, sy: 0, sw: img.width, sh: img.height }]); }
      };
      img.onerror = function () { resolve(null); };
      img.src = SPRITES[k].src;
    });
  })).then(function (pairs) {
    var reg = {};
    pairs.forEach(function (pr) { if (pr) reg[pr[0]] = pr[1]; });
    return reg;
  });
}

<script>
/* lib/audio-engine.js — soft, warm ambient music + gentle cues (Web Audio API).
   Framework-free and asset-free: every sound is synthesised.

   Deliberately UNDERSTATED so it never grates over a long session:
     - PURE SINE tones only (no bright/edgy harmonics)
     - a LOW, warm register (nothing high or piercing; a gentle lowpass on top)
     - VERY quiet, with one barely-there whole-pad breath for life
     - NO chimes, NO fast tremolo, NO detune beating
     - harmony still MOVES: each mood slowly walks a short, calm chord progression
       (all A-anchored so moods cross smoothly) so it isn't a static drone.

   Moods follow the story's health:
     bright = A major loop  (A – F#m – D – E)      — hopeful
     soft   = open/floaty   (Aadd9 – F#m7 – Dmaj7 – Esus)
     low    = minor loop     (Am – F – C – G)       — sombre

   Autoplay: the AudioContext must be created/resumed from a user gesture, so create
   the engine and call start() inside a click handler.

   API: start(), setMood('bright'|'soft'|'low'), swell(), hush(), ending(tone),
        setMuted(bool), isMuted(), resume(), destroy().
*/
function createAudioEngine() {
  if (typeof window === 'undefined') return null;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;

  var ctx = null, master = null, padBus = null;
  var started = false, muted = false, destroyed = false;
  var pad = null, padMode = null, progIdx = 0, curChord = null;
  var stepTimer = 0, breatheLFO = null;

  var LEVEL = 0.60;                       // overall gentle level (was 0.85)

  // ---------------- iPhone/iPad: unlock audio + make it ignore the ring/silent switch ----------------
  // iOS Safari can silence this engine's output in two separate ways, which is why "no sound at
  // all on iPhone" is such a common report:
  //   (a) the AudioContext starts SUSPENDED and only truly unlocks the first time a sound is
  //       actually played through it inside a user gesture — resume() alone isn't always enough;
  //   (b) the physical ring/silent switch mutes Web Audio output UNLESS the page is also actively
  //       playing an HTML <audio>/<video> element, which elevates the page into a "media
  //       playback" session that iOS does not silence with the switch.
  // A ~0.5s silent WAV, embedded as a data URI (keeps the engine asset-free/offline), covers both:
  // played once through the AudioContext it unlocks it; looped as a hidden <audio> element it
  // keeps that "ignore the switch" session alive for as long as the game runs.
  var SILENT_WAV = 'data:audio/wav;base64,UklGRsQPAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YaAPAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
  var unlockAudioEl = null;

  function unlockIOS() {
    if (!ctx) return;
    // (a) play a silent buffer through the AudioContext to fully unlock it — a reliable recipe
    // for iOS Safari; resume() alone can leave it "running" in name but producing no output.
    try {
      var b = ctx.createBuffer(1, 1, 22050);
      var src = ctx.createBufferSource();
      src.buffer = b; src.connect(ctx.destination); src.start(0);
    } catch (e) { }
    // (b) keep a silent, looping <audio> element playing so iOS treats this page's audio as
    // media playback and ignores the ring/silent switch — created once, played on a real
    // user gesture (and replayed defensively whenever we get another gesture/visibility event).
    if (typeof document === 'undefined') return;
    if (!unlockAudioEl) {
      try {
        unlockAudioEl = document.createElement('audio');
        unlockAudioEl.setAttribute('playsinline', '');
        unlockAudioEl.setAttribute('webkit-playsinline', '');
        unlockAudioEl.loop = true;
        unlockAudioEl.preload = 'auto';
        unlockAudioEl.src = SILENT_WAV;
        unlockAudioEl.style.display = 'none';
        (document.body || document.documentElement).appendChild(unlockAudioEl);
      } catch (e) { }
    }
    if (unlockAudioEl) {
      try { var p = unlockAudioEl.play(); if (p && p.catch) p.catch(function () { }); } catch (e) { }
    }
  }

  function ensureCtx() {
    if (ctx) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : LEVEL;
    master.connect(ctx.destination);

    // pad bus -> a warm, fixed lowpass -> master.  A very slow, subtle breath on the bus
    // gain keeps it alive without any audible wobble.
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.2;
    padBus = ctx.createGain(); padBus.gain.value = 1;
    padBus.connect(lp); lp.connect(master);
    breatheLFO = ctx.createOscillator(); breatheLFO.frequency.value = 0.02;  // ~50s cycle
    var bg = ctx.createGain(); bg.gain.value = 0.10;
    breatheLFO.connect(bg); bg.connect(padBus.gain); breatheLFO.start();
  }

  // Warm, LOW chord voicings (pure sines). Top note kept ≤ ~330Hz so nothing is bright.
  var PROG = {
    bright: [
      [110.00, 164.81, 220.00, 277.18], // A    A2 E3 A3 C#4
      [92.50, 138.59, 185.00, 220.00],  // F#m  F#2 C#3 F#3 A3
      [110.00, 146.83, 220.00, 293.66], // D    A2 D3 A3 D4
      [123.47, 164.81, 246.94, 329.63]  // E    B2 E3 B3 E4
    ],
    soft: [
      [110.00, 164.81, 220.00, 246.94], // Aadd9 A2 E3 A3 B3
      [92.50, 138.59, 185.00, 277.18],  // F#m7  F#2 C#3 F#3 C#4
      [110.00, 146.83, 220.00, 277.18], // Dmaj7 A2 D3 A3 C#4
      [123.47, 164.81, 220.00, 246.94]  // Esus  B2 E3 A3 B3
    ],
    low: [
      [110.00, 164.81, 220.00, 261.63], // Am A2 E3 A3 C4
      [87.31, 130.81, 174.61, 261.63],  // F  F2 C3 F3 C4
      [130.81, 196.00, 261.63, 329.63], // C  C3 G3 C4 E4
      [98.00, 146.83, 196.00, 246.94]   // G  G2 D3 G3 B3
    ]
  };
  var VOICE_GAIN = [0.50, 0.40, 0.32, 0.24];   // upper voices quieter
  var VOICE_PAN  = [0.00, -0.22, 0.22, -0.10]; // gentle stereo spread

  // crossfade to a warm sine voicing of `freqs`
  function buildChord(freqs) {
    ensureCtx();
    var t = ctx.currentTime;
    curChord = freqs;
    var hadPad = !!pad;

    if (pad) {
      var old = pad;
      try {
        old.gain.gain.cancelScheduledValues(t);
        old.gain.gain.setValueAtTime(Math.max(0.0001, old.gain.gain.value), t);
        old.gain.gain.linearRampToValueAtTime(0.0001, t + 5.0);   // long, smooth crossfade
      } catch (e) { }
      setTimeout(function () { try { old.oscs.forEach(function (o) { o.stop(); }); } catch (e) { } }, 5400);
    }

    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.030, t + (hadPad ? 5.0 : 3.5));   // quiet, slow fade-in
    g.connect(padBus);

    var all = [];
    freqs.forEach(function (f, i) {
      var o = ctx.createOscillator();
      o.type = 'sine';                      // pure sine only — no edge
      o.frequency.value = f;
      var vg = ctx.createGain(); vg.gain.value = VOICE_GAIN[i] != null ? VOICE_GAIN[i] : 0.2;
      o.connect(vg);
      if (ctx.createStereoPanner) {
        var pan = ctx.createStereoPanner(); pan.pan.value = VOICE_PAN[i] != null ? VOICE_PAN[i] : 0;
        vg.connect(pan); pan.connect(g);
      } else { vg.connect(g); }
      o.start();
      all.push(o);
    });
    pad = { gain: g, oscs: all };
  }

  // slowly walk to the next chord in the current mood's progression
  function stepProgression() {
    if (destroyed) return;
    var delay = 18000 + Math.random() * 6000;    // hold each chord ~18–24s
    stepTimer = setTimeout(function () {
      if (!destroyed && started && ctx && ctx.state === 'running') {
        var prog = PROG[padMode] || PROG.soft;
        progIdx = (progIdx + 1) % prog.length;
        try { buildChord(prog[progIdx]); } catch (e) { }
      }
      stepProgression();
    }, delay);
  }

  // one-off soft, warm sine cue. `stagger` (seconds between note onsets) lets a cue gently
  // RISE (ascending freqs) or FALL (descending freqs) so its emotional direction reads —
  // uplifting for healthy choices, reflective/sombre for unhealthy ones. Still pure sine + quiet.
  function cue(freqs, peak, attack, hold, release, stagger) {
    if (!ctx) return;
    stagger = stagger || 0;
    var t0 = ctx.currentTime;
    var spread = stagger * (freqs.length - 1);
    var out = ctx.createGain(); out.gain.value = 0.0001; out.connect(master);
    out.gain.exponentialRampToValueAtTime(peak, t0 + attack);
    out.gain.setValueAtTime(peak, t0 + attack + hold + spread);
    out.gain.exponentialRampToValueAtTime(0.0006, t0 + attack + hold + spread + release);
    var end = t0 + attack + hold + spread + release + 0.1;
    freqs.forEach(function (f, i) {
      var o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      var g = ctx.createGain(); g.gain.value = 1 / (i + 1.5);
      o.connect(g); g.connect(out); o.start(t0 + i * stagger); o.stop(end);
    });
  }

  return {
    setMood: function (mode) {
      if (destroyed || !PROG[mode]) return;
      if (padMode === mode && pad) return;
      padMode = mode; progIdx = 0;
      if (started) { try { buildChord(PROG[mode][0]); } catch (e) { } }
    },
    start: function () {
      ensureCtx();
      if (ctx.state === 'suspended') ctx.resume();
      unlockIOS();                    // must run inside this same user-gesture call
      var first = !started;
      started = true;
      if (!pad) { if (!padMode) padMode = 'soft'; progIdx = 0; try { buildChord(PROG[padMode][0]); } catch (e) { } }
      if (first) stepProgression();
    },
    resume: function () { ensureCtx(); if (ctx.state === 'suspended') ctx.resume(); unlockIOS(); },
    // gentle, low, sine cues (no bright tops). Healthy = a soft rising figure (uplifting);
    // unhealthy = a soft falling figure (reflective). Kept quiet so it never grates.
    swell: function () { cue([220.00, 277.18, 329.63], 0.075, 0.35, 0.15, 1.8, 0.11); },       // rising, warm
    hush: function () { cue([164.81, 130.81, 110.00], 0.07, 0.30, 0.20, 2.2, 0.13); },          // falling, sombre
    ending: function (tone) {
      if (tone === 'withered') cue([146.83, 110.00, 87.31], 0.075, 0.35, 0.35, 3.4, 0.16);      // slow fall
      else if (tone === 'recovering') cue([174.61, 220.00, 261.63], 0.07, 0.5, 0.25, 2.4, 0.12); // gentle rise
      else cue([220.00, 277.18, 329.63, 392.00], 0.08, 0.45, 0.35, 2.8, 0.11);                   // flourishing, rising
    },
    setMuted: function (m) {
      muted = m;
      if (master && ctx) {
        var t = ctx.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        master.gain.linearRampToValueAtTime(m ? 0 : LEVEL, t + 0.3);
      }
    },
    isMuted: function () { return muted; },
    destroy: function () {
      destroyed = true;
      clearTimeout(stepTimer);
      if (pad) { try { pad.oscs.forEach(function (o) { o.stop(); }); } catch (e) { } pad = null; }
      try { if (breatheLFO) breatheLFO.stop(); } catch (e) { }
      try { if (ctx) ctx.close(); } catch (e) { }
      if (unlockAudioEl) { try { unlockAudioEl.pause(); unlockAudioEl.remove(); } catch (e) { } unlockAudioEl = null; }
    }
  };
}

<script>
/* lib/game-content.js — "Power, Pressure & Choice" (Migration Pressure edition)
   Built to the Edu team's final Game Blueprint. Simple English (EAL). Two phases:

     PHASE 1 — Experience the Problem: follow Orion.
       pressure -> behaviour -> impact -> belief -> root  (the tree declines).
     PHASE 2 — Rebuild the Outcome: the player becomes the leader.
       attitude -> behaviour -> impact -> outcome, then key messages,
       a leadership pledge, and support / next steps  (the tree heals).

   Node fields:
     type: 'intro' | 'story' | 'pick' | 'commit' | 'ending'
     For 'story'/'intro': next, kind, fx, btn (+ optional altNext/altBtn, showLegend, display)
     For 'pick': options[{label, kind, next, fx, info}]
     kind: 'healthy' | 'harmful' | 'neutral'  — drives consequence, NOT appearance.
     fx: { health, mood?, palette?, density?, shed? }

   PEDAGOGY GUARDRAILS (do not "fix" these):
   - Understanding patterns, not blaming individuals or culture.
   - The pressures (roots) and the impacts (branches) are never a "wrong answer".
   - Harmful behaviour never heals the tree; help-seeking always heals.
   - No outcome is caused by the pressure itself — outcomes follow the REBUILD choices.
   - The 1800RESPECT / 000 support line shows on every screen. No shame language.
   - The "Damaged" outcome is always reversible — it offers "Go back and rebuild".
*/

var STEPS = [
  // ---------------- PHASE 1 — EXPERIENCE THE PROBLEM ----------------

  {

<script>
/* lib/i18n.js — localisation layer for "Shaping Change".
 *
 * The game is for migrant, English-as-an-additional-language communities, so it is
 * built to be delivered in community languages. This module is the SEAM for that:
 * the English copy in game-content.js is the source of truth and the fallback, and a
 * language pack supplies per-node text overrides + UI-chrome strings.
 *
 * IMPORTANT — this is a family/domestic-violence PRIMARY-PREVENTION tool. Translations
 * carry pedagogy and safety nuance and MUST be produced/validated by qualified
 * translators and re-checked with the Edu team (Thuy) + PVAW (Anu/Ali) before a
 * language is switched on. DO NOT auto-/machine-translate this content and ship it.
 * A mistranslation here is not a typo — it can invert the meaning of a safety message.
 *
 * To add a language:
 *   1. Generate a template of every translatable string:  npm run i18n:template
 *      (writes lib/i18n-<lang>.template.json — see docs/I18N_TRANSLATION_GUIDE.md)
 *   2. Have it professionally translated + reviewed.
 *   3. Register it in PACKS below (code → { meta, ui, nodes }).
 *   4. Re-run the pedagogy check against the translated build.
 * The language picker appears automatically once more than one pack is registered.
 */

// Which node fields hold player-facing text (used by translateNode + the template gen).
var TRANSLATABLE_FIELDS = ['tag', 'prompt', 'hint', 'btn', 'altBtn'];
var TRANSLATABLE_OPTION_FIELDS = ['label', 'info'];

// UI chrome strings (everything not coming from a content node).
var UI_EN = {
  startOver: 'Start over',
  prevStep: 'Previous step',
  readAloud: 'Read the text aloud',
  stopReading: 'Stop reading',
  soundOn: 'Turn sound on',
  soundOff: 'Turn sound off',
  skipToActivity: 'Skip to the activity',
  language: 'Language',
  welcome: 'Welcome',
  complete: 'Complete',
  stepOf: 'Step {n} of {total}',
  framing: 'This is about understanding patterns — not blaming people or cultures. A simple story, with real choices.',
  supportLine: 'Need to talk? Call 1800RESPECT (1800 737 732). In an emergency, call 000.',
  printPlan: 'Print or save my summary',
  keepsakeTitle: 'Shaping Change — my journey',
  keepsakeIntro: 'A summary of the choices I made and the plan I am taking home.',
  keepsakePledge: 'My pledge as a leader',
  keepsakeJourney: 'The choices I explored',
  keepsakeOutcome: 'Where it led',
  keepsakeFelt: 'How I felt',
  keepsakePrepared: 'Prepared on',
  keepsakeQuestions: 'Questions I will keep asking myself',
  keepsakeRemember: 'Worth remembering',
  keepsakeFoot: 'A keepsake from the Shaping Change activity. Support is always available.',
  coachExplore: 'Tap each part of the tree to explore it.',
  coachDrop: 'Drag your choice onto the tree — or just tap it.',
  coachDismiss: 'Got it',
  reflectQuestion: 'Optional: how ready do you feel to lead positive change at home?',
  reflectSkip: 'Prefer not to say',
  reflectThanks: 'Thank you.',
  reflectShift: 'You started here — and finished here:',
  reflectStart: 'At the start',
  reflectEnd: 'At the end',
  facTitle: 'Facilitator mode',
  facDiscuss: 'Discussion prompt',
  facReset: 'Reset for next participant',
  facHide: 'Hide facilitator notes'
};

// Group-delivery discussion prompts, keyed by node phase. These are FACILITATOR guidance,
// deliberately kept OUT of the signed-off learner content (game-content.js) so they never
// affect the activity itself — shown only when facilitator mode is on.
var FACILITATOR_PROMPTS = {
  Meet: 'Invite the group: what pressures do people face when they first arrive in a new country?',
  Pressure: 'Ask: which of these pressures feel familiar? How do they show up at home?',
  Behaviour: 'Discuss: why might someone respond this way? Separate understanding the cause from excusing the harm.',
  Impact: 'Ask the group: who else feels the effects of these choices, and how?',
  Belief: 'Explore: where do these beliefs come from? Which ones can a strong leader question?',
  Root: 'Use the tree model: which part (roots, soil, trunk, branches) is easiest to change first, and why?',
  Rebuild: 'Ask: what would sharing power actually look like day-to-day in this family?',
  Outcome: 'Reflect: what made the difference between the outcomes? What is one small first step?',
  Leadership: 'Invite each person to name one action they will take as a leader this week.',
  Support: 'Close by naming the local services available, and remind the group support is confidential.'
};

function facilitatorPrompt(phase) { return FACILITATOR_PROMPTS[phase] || ''; }

// Registered language packs. English is implicit (the source). Add reviewed packs here.
// Example shape (do NOT fill with machine translation):
//   'ar': { meta: { name: 'العربية', dir: 'rtl' }, ui: {…}, nodes: { intro: { prompt: '…', hint: '…' }, … } }
var PACKS = {
  en: { meta: { name: 'English', dir: 'ltr' }, ui: UI_EN, nodes: {} }
};

var DEFAULT_LANG = 'en';

function availableLanguages() {
  return Object.keys(PACKS).map((code) => ({ code, name: PACKS[code].meta.name, dir: PACKS[code].meta.dir }));
}

function langMeta(lang) {
  const p = PACKS[lang] || PACKS[DEFAULT_LANG];
  return p.meta;
}

// A UI string in the chosen language, English fallback, with {n}/{total} interpolation.
function uiString(key, lang, vars) {
  const pack = PACKS[lang] || PACKS[DEFAULT_LANG];
  let s = (pack.ui && pack.ui[key] != null) ? pack.ui[key] : UI_EN[key];
  if (s == null) s = key;
  if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}

// A shallow, DISPLAY-ONLY translated copy of a content node. Logic fields (id, type,
// next, altNext, fx, kind, options[].next/fx/kind, display, reveal.btn target, etc.)
// are preserved from the source — only visible text is overlaid. Callers use the source
// node for navigation/scoring and this copy for what the player reads.
function translateNode(node, lang) {
  if (!node || !lang || lang === DEFAULT_LANG) return node;
  const pack = PACKS[lang];
  const over = pack && pack.nodes && pack.nodes[node.id];
  if (!over) return node;
  const out = Object.assign({}, node);
  for (const f of TRANSLATABLE_FIELDS) if (over[f] != null) out[f] = over[f];
  if (over.reveal && node.reveal) out.reveal = Object.assign({}, node.reveal, over.reveal);
  if (Array.isArray(node.options)) {
    out.options = node.options.map((opt, i) => {
      const oo = over.options && over.options[i];
      if (!oo) return opt;
      const copy = Object.assign({}, opt);
      for (const f of TRANSLATABLE_OPTION_FIELDS) if (oo[f] != null) copy[f] = oo[f];
      return copy;
    });
  }
  return out;
}
